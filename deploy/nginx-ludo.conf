# Ludo Master 3D — nginx site config
# Static client served from /var/www/ludo; /api + /socket.io proxied to Node.
# Replace YOUR_DOMAIN_OR_IP below with your server's domain or public IP.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Static game client (no build step — plain HTML/CSS/JS)
    root /var/www/ludo;
    index index.html;

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO (needs websocket upgrade)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # SPA fallback for the static client
    location / {
        try_files $uri $uri/ /index.html;
    }
}
